spring.application.name=medicompare-backend

server.port=8080

# =========================================================
# PostgreSQL Database
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/medicompare
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# File Upload
# =========================================================

file.upload-dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# =========================================================
# Spring AI + OpenRouter
# =========================================================

spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}

spring.ai.openai.chat.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.api-key=${OPENROUTER_API_KEY}

spring.ai.openai.chat.model=openai/gpt-5-mini
spring.ai.openai.chat.max-completion-tokens=2000

spring.ai.openai.timeout=60s
spring.ai.openai.max-retries=3